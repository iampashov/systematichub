<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><rect width="800" height="500" rx="32" fill="#EAF0FD"/><text x="400" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#16243F">CRAFT: five elements of a strong prompt</text><rect x="70" y="110" width="118" height="118" rx="20" fill="#16243F"/><text x="129" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">C</text><text x="129" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#16243F">Context</text><text x="129" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#46546E">who, what situation</text><rect x="204" y="110" width="118" height="118" rx="20" fill="#2E6FF2"/><text x="263" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">R</text><text x="263" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#16243F">Role</text><text x="263" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#46546E">act as a ...</text><rect x="338" y="110" width="118" height="118" rx="20" fill="#36C98E"/><text x="397" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">A</text><text x="397" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#16243F">Action</text><text x="397" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#46546E">one task, one verb</text><rect x="472" y="110" width="118" height="118" rx="20" fill="#E3B23C"/><text x="531" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">F</text><text x="531" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#16243F">Format</text><text x="531" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#46546E">length, structure</text><rect x="606" y="110" width="118" height="118" rx="20" fill="#7B61FF"/><text x="665" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">T</text><text x="665" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#16243F">Tone</text><text x="665" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#46546E">warm, simple, formal</text><rect x="90" y="340" width="620" height="100" rx="16" fill="#FFFFFF" stroke="#D3DCF0" stroke-width="3"/><text x="400" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16243F">weak prompt  →  CRAFT prompt  →  one answer you can use</text><text x="400" y="414" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#46546E">fewer regenerations, better result</text></svg>