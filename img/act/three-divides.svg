<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><rect width="800" height="500" rx="32" fill="#EAF0FD"/><text x="400" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#16243F">Three digital divides</text><rect x="70" y="90" width="210" height="330" rx="20" fill="#16243F"/><text x="175" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Access</text><text x="175" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">no device</text><text x="175" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">no connection</text><text x="175" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">too expensive</text><text x="175" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">rural gaps</text><rect x="295" y="90" width="210" height="330" rx="20" fill="#2E6FF2"/><text x="400" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Use</text><text x="400" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">no skills</text><text x="400" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">no confidence</text><text x="400" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">language</text><text x="400" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">no support</text><rect x="520" y="90" width="210" height="330" rx="20" fill="#36C98E"/><text x="625" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Quality of use</text><text x="625" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">scrolling only</text><text x="625" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">scams and harm</text><text x="625" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">no benefit</text><text x="625" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">no voice online</text></svg>