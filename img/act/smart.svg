<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><rect width="800" height="500" rx="32" fill="#EAF0FD"/><text x="400" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#16243F">SMART goals</text><rect x="90" y="70" width="620" height="68" rx="14" fill="#FFFFFF" stroke="#D3DCF0" stroke-width="3"/><rect x="90" y="70" width="68" height="68" rx="14" fill="#16243F"/><text x="124" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">S</text><text x="180" y="100" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#16243F">Specific</text><text x="180" y="124" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#46546E">one clear result, who and what</text><rect x="90" y="152" width="620" height="68" rx="14" fill="#FFFFFF" stroke="#D3DCF0" stroke-width="3"/><rect x="90" y="152" width="68" height="68" rx="14" fill="#2E6FF2"/><text x="124" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">M</text><text x="180" y="182" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#16243F">Measurable</text><text x="180" y="206" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#46546E">how will you know it happened?</text><rect x="90" y="234" width="620" height="68" rx="14" fill="#FFFFFF" stroke="#D3DCF0" stroke-width="3"/><rect x="90" y="234" width="68" height="68" rx="14" fill="#36C98E"/><text x="124" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">A</text><text x="180" y="264" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#16243F">Achievable</text><text x="180" y="288" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#46546E">realistic with your time and resources</text><rect x="90" y="316" width="620" height="68" rx="14" fill="#FFFFFF" stroke="#D3DCF0" stroke-width="3"/><rect x="90" y="316" width="68" height="68" rx="14" fill="#E3B23C"/><text x="124" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">R</text><text x="180" y="346" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#16243F">Relevant</text><text x="180" y="370" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#46546E">linked to what matters to you and your group</text><rect x="90" y="398" width="620" height="68" rx="14" fill="#FFFFFF" stroke="#D3DCF0" stroke-width="3"/><rect x="90" y="398" width="68" height="68" rx="14" fill="#7B61FF"/><text x="124" y="444" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">T</text><text x="180" y="428" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#16243F">Time-based</text><text x="180" y="452" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#46546E">a date, not someday</text></svg>