<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><rect width="800" height="500" rx="32" fill="#EAF0FD"/><text x="400" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#16243F">The Eisenhower matrix</text><text x="300" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#46546E">Urgent</text><text x="560" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#46546E">Not urgent</text><text transform="translate(130 240) rotate(-90)" text-anchor="middle" font-family="Inter, Arial" font-size="18" font-weight="600" fill="#46546E">Important</text><text transform="translate(130 400) rotate(-90)" text-anchor="middle" font-family="Inter, Arial" font-size="18" font-weight="600" fill="#46546E">Not important</text><rect x="180" y="110" width="240" height="150" rx="18" fill="#36C98E"/><text x="300" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Do</text><text x="300" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">urgent + important</text><rect x="440" y="110" width="240" height="150" rx="18" fill="#E3B23C"/><text x="560" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Decide</text><text x="560" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">schedule it</text><rect x="180" y="290" width="240" height="150" rx="18" fill="#2E6FF2"/><text x="300" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Delegate</text><text x="300" y="395" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">who can do it?</text><rect x="440" y="290" width="240" height="150" rx="18" fill="#E25C5C"/><text x="560" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Delete</text><text x="560" y="395" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">drop it</text></svg>