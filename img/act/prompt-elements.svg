<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><rect width="800" height="500" rx="32" fill="#EAF0FD"/><text x="400" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#16243F">Six elements of an image prompt</text><rect x="80" y="90" width="200" height="140" rx="18" fill="#16243F"/><text x="180" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Subject</text><text x="180" y="182" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">who or what</text><rect x="300" y="90" width="200" height="140" rx="18" fill="#2E6FF2"/><text x="400" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Environment</text><text x="400" y="182" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">where, atmosphere</text><rect x="520" y="90" width="200" height="140" rx="18" fill="#36C98E"/><text x="620" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Medium</text><text x="620" y="182" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">photo, oil, 3D</text><rect x="80" y="260" width="200" height="140" rx="18" fill="#E3B23C"/><text x="180" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Quality</text><text x="180" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">detail, light</text><rect x="300" y="260" width="200" height="140" rx="18" fill="#7B61FF"/><text x="400" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Style</text><text x="400" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">genre or studio</text><rect x="520" y="260" width="200" height="140" rx="18" fill="#16243F"/><text x="620" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Mood</text><text x="620" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">colour, feeling</text></svg>